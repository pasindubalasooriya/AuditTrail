# ─── Database connection (app logs in as the least-privilege user) ───
spring.datasource.url=jdbc:postgresql://localhost:5432/audittrail_db
spring.datasource.username=${DB_USERNAME:audittrail_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate: Flyway owns the schema, Hibernate must NOT touch it ───
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway: runs migrations as the privileged owner (postgres), since
#     creating tables/triggers needs ownership the app user doesn't have ───
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${FLYWAY_USER:postgres}
spring.flyway.password=${FLYWAY_PASSWORD}

# ─── Server ───
server.port=8080

# ─── WSO2 IS — JWT validation ───
# jwk-set-uri: where Spring fetches WSO2's public signing keys to verify the token signature.
# issuer-uri: the token's "iss" must match this exactly (see the verified landmine).
# NOTE: clients send the OIDC id_token as the bearer (it carries sub=username AND the roles claim;
# WSO2's access token omits user roles by design).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://localhost:9443/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost:9443/oauth2/token
